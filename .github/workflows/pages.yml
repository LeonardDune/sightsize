name: Deploy naar GitHub Pages

on:
  push:
    branches: [main, claude/session-syx8s1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Buildstempel invullen (cache-busting + zichtbaar versienummer)
        run: sed -i "s/__BUILD__/${GITHUB_SHA:0:7}/g" index.html sw.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
